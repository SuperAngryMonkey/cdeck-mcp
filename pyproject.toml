[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdeck-mcp"
version = "0.1.0"
description = "Claude-side MCP for the CDeck Apple TV dashboard: pair with the code on your TV, push a deck of stats/lists/calendar, read back what you checked off."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "800 Pound Gorilla Inc.", email = "james@bigassmonkey.com" }]
keywords = ["mcp", "model-context-protocol", "apple-tv", "tvos", "dashboard", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["mcp>=1.2.0,<2", "requests>=2.31.0"]

[project.urls]
Homepage = "https://github.com/SuperAngryMonkey/cdeck-mcp"
Source = "https://github.com/SuperAngryMonkey/cdeck-mcp"
Issues = "https://github.com/SuperAngryMonkey/cdeck-mcp/issues"
"Apple TV app" = "https://github.com/SuperAngryMonkey/CDeck"

[project.scripts]
cdeck-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
sources = ["."]

[tool.hatch.build.targets.sdist]
include = ["server.py", "README.md", "LICENSE", "pyproject.toml", "server.json"]
